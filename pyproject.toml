[project]
name = "visionpipe"
version = "0.1.0"
description = "Modular object detection pipeline with swappable backbones"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "ultralytics>=8.3.0",
    "lightning>=2.2.0",
    "albumentations>=1.4.0",
    "omegaconf>=2.3.0",
    "pycocotools>=2.0.8",
    "torchmetrics>=1.3.0",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.9.0",
    "pre-commit>=4.0.0",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.isort]
known-first-party = ["visionpipe"]
